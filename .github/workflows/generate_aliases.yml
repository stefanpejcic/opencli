name: Generate Aliases

on:
  schedule:
    - cron: '14 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # On demand

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # latest 1.26 patch, go.mod's 1.26.0 has stdlib CVEs govulncheck rejects
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Build opencli
        run: CGO_ENABLED=0 go build -o opencli-bin ./cmd/opencli

      - name: Generate commands
        run: |
          sudo mkdir -p /usr/local/opencli
          sudo ./opencli-bin --help

      - name: Copy generated aliases back
        run: cp /usr/local/opencli/aliases.txt aliases.txt

      - name: Commit aliases file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aliases.txt
          git diff --cached --quiet || git commit -m "chore: update aliases.txt [skip ci]"
          git push
